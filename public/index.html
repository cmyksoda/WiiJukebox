<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d141c" media="(prefers-color-scheme: dark)">
<title>WiiJukebox</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="images/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The visualizer sits behind everything, so it can be revealed by fading the
     UI rather than swapping views. -->
<canvas id="visualizer"></canvas>
<div id="viz-overlay" hidden><span id="viz-preset"></span></div>

<div id="app">
  <button id="sidebar-shade" aria-label="Close channels" tabindex="-1"></button>
  <aside id="sidebar" aria-label="Music sources">
    <header id="brand">
      <strong><span class="wii-word">Wii</span>Jukebox<span class="logo-mark" aria-hidden="true"></span></strong>
      <button id="sources-close" class="pill icon" aria-label="Close channels"><i class="g g-close" aria-hidden="true"></i></button>
    </header>

    <nav id="sources" aria-label="Sources"></nav>

    <div id="setup">
      <h3>Your Wii</h3>
      <p class="hint">Open WiiJukebox on your Wii and it connects to this server by itself.</p>
      <p class="hint" id="wii-address"></p>
      <p class="hint" id="stream-addr"></p>
    </div>
  </aside>

  <main id="main">
    <div id="toolbar">
      <button id="sources-toggle" class="pill menu-button" aria-label="Open channels" aria-controls="sidebar" aria-expanded="false"><i class="g g-menu" aria-hidden="true"></i><span class="pill-label">Channels</span></button>
      <button id="back" class="pill icon" title="Back" aria-label="Back to previous folder" hidden><i class="g g-left" aria-hidden="true"></i></button>
      <h2 id="crumb">Channels</h2>
      <button id="settings-btn" class="pill small" hidden>Settings</button>
      <input id="search" type="search" placeholder="Search" aria-label="Search" hidden>
    </div>

    <nav id="pagination" aria-label="Library pages" hidden>
      <button class="pill icon page-button" id="library-prev" title="Previous page" aria-label="Previous page"><i class="g g-left" aria-hidden="true"></i></button>
      <span id="library-page" aria-live="polite"></span>
      <button class="pill icon page-button" id="library-next" title="Next page" aria-label="Next page"><i class="g g-right" aria-hidden="true"></i></button>
    </nav>
    <div id="content"></div>
  </main>

  <!-- A column beside the library on wide screens, a sheet over it on phones. -->
  <section id="nowplaying" aria-label="Now playing">
    <header id="np-head">
      <span class="eyebrow">Now playing</span>
      <button id="np-close" class="pill icon" aria-label="Hide now playing"><i class="g g-down" aria-hidden="true"></i></button>
    </header>

    <div id="np-art-frame">
      <span id="np-placeholder" aria-hidden="true"></span>
      <img id="np-art" alt="" hidden>
    </div>

    <div id="np-text">
      <div id="np-title">Nothing playing</div>
      <div id="np-artist"></div>
      <span id="np-source" class="chip" hidden></span>
    </div>

    <div id="seek">
      <span id="np-elapsed" class="time">0:00</span>
      <input id="seekbar" type="range" min="0" max="1000" value="0" step="1" aria-label="Playback position" disabled>
      <span id="np-total" class="time">0:00</span>
    </div>

    <!-- Controls are enabled per-source from the capabilities the server
         reports, so nothing here ever pretends to work when it can't. -->
    <div id="controls">
      <button id="prev" aria-label="Previous track" class="round" title="Previous" disabled><i class="g g-prev" aria-hidden="true"></i></button>
      <button id="playpause" aria-label="Play" class="round big" title="Play" disabled><i class="g g-play" aria-hidden="true"></i><i class="g g-pause" aria-hidden="true"></i></button>
      <button id="next" aria-label="Next track" class="round" title="Next" disabled><i class="g g-next" aria-hidden="true"></i></button>
      <button id="stop" aria-label="Stop" class="round small" title="Stop" disabled><i class="g g-stop" aria-hidden="true"></i></button>
    </div>

    <div id="np-extras">
      <span id="listeners" class="chip" title="Devices connected to the stream">0 listening</span>
      <button id="monitor" class="pill small" title="Play the stream here in the browser" aria-label="Monitor audio on this device" aria-pressed="false">Monitor</button>
      <button id="viz-toggle" class="pill small" aria-label="Toggle visualizer" aria-pressed="false">Visualizer</button>
    </div>
  </section>
</div>

<!-- Phone transport bar; opens the sheet. In visualizer mode it is the only
     UI left, so it carries the extra controls too. -->
<footer id="player">
  <div id="mini-progress" aria-hidden="true"><i></i></div>
  <button id="mini-open" aria-label="Open now playing" aria-controls="nowplaying" aria-expanded="false">
    <span id="mini-art"><span id="mini-placeholder" aria-hidden="true"></span><img id="mini-img" alt="" hidden></span>
    <span id="mini-text">
      <span id="mini-title">Nothing playing</span>
      <span id="mini-artist"></span>
    </span>
  </button>
  <div id="mini-controls">
    <button id="mini-prev" aria-label="Previous track" class="round small viz-only" disabled><i class="g g-prev" aria-hidden="true"></i></button>
    <button id="mini-playpause" aria-label="Play" class="round" disabled><i class="g g-play" aria-hidden="true"></i><i class="g g-pause" aria-hidden="true"></i></button>
    <button id="mini-next" aria-label="Next track" class="round small viz-only" disabled><i class="g g-next" aria-hidden="true"></i></button>
    <button id="mini-monitor" class="pill small viz-only" aria-label="Monitor audio on this device" aria-pressed="false">Monitor</button>
    <button id="mini-viz" class="pill small viz-only" aria-label="Close visualizer" aria-pressed="true">Close</button>
  </div>
</footer>

<div id="toast" hidden role="status"></div>

<!-- Audio element used only for local monitoring; it is also what feeds the
     visualizer, since Butterchurn needs a Web Audio node to analyse. -->
<audio id="monitor-audio" crossorigin="anonymous"></audio>

<!-- Butterchurn 3.x ships as an ES module, so app.js is a module too and
     imports it directly. The preset bundles are still UMD and are loaded on
     demand from app.js instead. -->
<script type="module" src="app.js"></script>
</body>
</html>
