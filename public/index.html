<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WiiJukebox</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The visualizer sits behind everything, so it can be revealed by fading the
     UI rather than swapping views. -->
<canvas id="visualizer"></canvas>
<div id="viz-overlay" hidden><span id="viz-preset"></span></div>

<div id="app">
  <button id="sidebar-shade" aria-label="Close sources" tabindex="-1"></button>
  <aside id="sidebar" aria-label="Music sources">
    <header id="brand">
      <strong><span class="wii-word">Wii</span>Jukebox</strong>
      <button id="sources-close" class="icon-btn" aria-label="Close sources">&times;</button>
    </header>

    <nav id="sources" aria-label="Sources"></nav>

    <div id="setup">
      <h3>Your Wii</h3>
      <p class="hint">Open WiiJukebox on your Wii and choose this server on the same network.</p>
      <p class="hint" id="server-id"></p>
      <p class="hint">Using WiiRadio instead?</p>
      <a id="pls-link" class="btn" href="/playlist.pls" download>Download playlist</a>
      <p class="hint">Put it in <code>/apps/radiow/data/pls/</code> on your SD card.</p>
      <p class="hint" id="stream-addr"></p>
    </div>
  </aside>

  <main id="main">
    <div id="toolbar">
      <button id="sources-toggle" class="icon-btn menu-button" aria-label="Open sources" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
      <button id="back" class="icon-btn" title="Back" hidden>&larr;</button>
      <h2 id="crumb">Pick a source</h2>
      <input id="search" type="search" placeholder="Search" hidden>
    </div>

    <div id="pagination" hidden>
      <button class="btn small" id="library-prev">Previous page</button>
      <span id="library-page"></span>
      <button class="btn small" id="library-next">Next page</button>
    </div>
    <div id="content"></div>

    <div id="empty" class="empty">
      <p>Choose a source to get started.</p>
    </div>
  </main>
</div>

<!-- Transport bar. Controls are enabled per-source from the capabilities the
     server reports, so nothing here ever pretends to work when it can't. -->
<footer id="player">
  <div id="np">
    <span id="np-placeholder" aria-hidden="true">♫</span>
    <img id="np-art" alt="" hidden>
    <div id="np-text">
      <div id="np-title">Nothing playing</div>
      <div id="np-artist"></div>
    </div>
  </div>

  <div id="controls">
    <button id="prev" aria-label="Previous track" class="icon-btn" title="Previous" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 8 12l11 7Z"/></svg></button>
    <button id="playpause" aria-label="Play" class="icon-btn big" title="Play" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause-icon" d="M8 5v14M16 5v14"/><path class="play-icon" d="m8 5 11 7-11 7Z"/></svg></button>
    <button id="next" aria-label="Next track" class="icon-btn" title="Next" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l11 7-11 7Z"/></svg></button>
    <button id="stop" aria-label="Stop" class="icon-btn" title="Stop" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  </div>

  <div id="right">
    <span id="listeners" title="Devices connected to the stream">0 listening</span>
    <button id="monitor" class="btn small" title="Play the stream here in the browser" aria-label="Monitor audio on this device" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 12H2v7h4v-7Zm16 0h2v7h-4v-7Z"/></svg><span class="button-label">Monitor</span></button>
    <button id="viz-toggle" class="btn small" aria-label="Toggle visualizer" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 5v14M12 8v8M16 3v18M20 9v6"/></svg><span class="button-label">Visualizer</span></button>
  </div>
</footer>

<div id="toast" hidden></div>

<!-- Audio element used only for local monitoring; it is also what feeds the
     visualizer, since Butterchurn needs a Web Audio node to analyse. -->
<audio id="monitor-audio" crossorigin="anonymous"></audio>

<!-- Butterchurn 3.x ships as an ES module, so app.js is a module too and
     imports it directly. The preset bundles are still UMD and are loaded on
     demand from app.js instead. -->
<script type="module" src="app.js"></script>
</body>
</html>
