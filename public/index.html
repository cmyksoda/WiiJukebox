<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiiJukebox</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The visualizer sits behind everything, so it can be revealed by fading the
     UI rather than swapping views. -->
<canvas id="visualizer"></canvas>
<div id="viz-overlay" hidden><span id="viz-preset"></span></div>

<div id="app">
  <button id="sidebar-shade" aria-label="Close sources" tabindex="-1"></button>
  <aside id="sidebar">
    <header id="brand">
      <strong>WiiJukebox</strong>
      <button id="sources-close" class="icon-btn" aria-label="Close sources">&times;</button>
    </header>

    <nav id="sources" aria-label="Sources"></nav>

    <div id="setup">
      <h3>Your Wii</h3>
      <p class="hint">Open WiiJukebox on your Wii and choose this server on the same network.</p>
      <p class="hint" id="server-id"></p>
      <p class="hint">Using WiiRadio instead?</p>
      <a id="pls-link" class="btn" href="/playlist.pls" download>Download playlist</a>
      <p class="hint">Put it in <code>/apps/radiow/data/pls/</code> on your SD card.</p>
      <p class="hint" id="stream-addr"></p>
    </div>
  </aside>

  <main id="main">
    <div id="toolbar">
      <button id="sources-toggle" class="btn small" aria-controls="sidebar" aria-expanded="false">Sources</button>
      <button id="back" class="icon-btn" title="Back" hidden>&larr;</button>
      <h2 id="crumb">Pick a source</h2>
      <input id="search" type="search" placeholder="Search" hidden>
    </div>

    <div id="pagination" hidden>
      <button class="btn small" id="library-prev">Previous page</button>
      <span id="library-page"></span>
      <button class="btn small" id="library-next">Next page</button>
    </div>
    <div id="content"></div>

    <div id="empty" class="empty">
      <p>Choose a source to get started.</p>
    </div>
  </main>
</div>

<!-- Transport bar. Controls are enabled per-source from the capabilities the
     server reports, so nothing here ever pretends to work when it can't. -->
<footer id="player">
  <div id="np">
    <img id="np-art" alt="" hidden>
    <div id="np-text">
      <div id="np-title">Nothing playing</div>
      <div id="np-artist"></div>
    </div>
  </div>

  <div id="controls">
    <button id="prev" class="icon-btn" title="Previous" disabled>&#9198;</button>
    <button id="playpause" class="icon-btn big" title="Play" disabled>&#9199;</button>
    <button id="next" class="icon-btn" title="Next" disabled>&#9197;</button>
    <button id="stop" class="icon-btn" title="Stop" disabled>&#9632;</button>
  </div>

  <div id="right">
    <span id="listeners" title="Wii consoles connected">0 listening</span>
    <button id="monitor" class="btn small" title="Play the stream here in the browser">Monitor</button>
    <button id="viz-toggle" class="btn small">Visualizer</button>
  </div>
</footer>

<div id="toast" hidden></div>

<!-- Audio element used only for local monitoring; it is also what feeds the
     visualizer, since Butterchurn needs a Web Audio node to analyse. -->
<audio id="monitor-audio" crossorigin="anonymous"></audio>

<!-- Butterchurn 3.x ships as an ES module, so app.js is a module too and
     imports it directly. The preset bundles are still UMD and are loaded on
     demand from app.js instead. -->
<script type="module" src="app.js"></script>
</body>
</html>
