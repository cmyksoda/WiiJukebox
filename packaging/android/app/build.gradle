plugins {
    id 'com.android.application'
}

// The release key lives outside the repository; without it only debug builds work.
def signingFile = file(System.getenv('WIIJUKEBOX_SIGNING') ?:
        "${System.getProperty('user.home')}/.local/share/wiijukebox-signing/keystore.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

// One version for every app, from the server's package.json; versionCode must grow with each release.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json')).version
def (major, minor, patch) = appVersion.tokenize('.-')[0..2].collect { it as int }

android {
    namespace 'org.wiijukebox.android'
    compileSdk 37

    defaultConfig {
        applicationId 'org.wiijukebox.controller'
        minSdk 26
        targetSdk 36
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
    }
}
