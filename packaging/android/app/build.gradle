plugins {
    id 'com.android.application'
}

android {
    namespace 'org.wiijukebox.android'
    compileSdk 37

    defaultConfig {
        applicationId 'org.wiijukebox.controller'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}
