name: Build

# The desktop app, the Wii app and the Android controller. Pushes and pull requests build the desktop app
# for Linux only; [ci all], [ci windows] or [ci macos] in a commit message, "Run workflow", or a v* tag
# build Windows and macOS too (on a private repository their minutes cost 2x and 10x).
# Only "Run workflow" (for one day) and v* tags keep files, since installers kept from every push once
# filled the 500 MB of Actions storage in a day; test/workflow-storage.test.js holds every upload to that.
on:
    push:
        branches: [main]
        tags: ['v*']
        paths:
            - 'packaging/desktop/**'
            - 'packaging/android/**'
            - 'client/**'
            - 'src/**'
            - 'public/**'
            - 'test/**'
            - 'tools/**'
            - 'package*.json'
            - '.github/workflows/build.yml'
    pull_request:
        paths:
            - 'packaging/desktop/**'
            - 'packaging/android/**'
            - 'client/**'
            - 'src/**'
            - 'public/**'
            - 'test/**'
            - 'tools/**'
            - 'package*.json'
            - '.github/workflows/build.yml'
    workflow_dispatch:
        inputs:
            platforms:
                description: Which systems to build
                type: choice
                options: [all, linux, windows, macos]
                default: all

# A newer push replaces a run that is still going.
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # The smoke test runs the packaged app on these instead of the default 4005.
    SMOKE_PORT: 4680

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.pick.outputs.matrix }}
            bundled: ${{ steps.pick.outputs.bundled }}
        steps:
            - name: Check out the repository
              if: startsWith(github.ref, 'refs/tags/v')
              uses: actions/checkout@v7

            # Here a wrong tag fails in seconds rather than after the builds.
            - name: Check the tag against the version, and that it carries release notes
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
                  REPO: ${{ github.repository }}
              run: |
                  version=$(jq -r .version package.json)
                  [ "$TAG" = "v$version" ] || { echo "::error::$TAG does not match version $version in package.json"; exit 1; }
                  type=$(gh api "repos/$REPO/git/refs/tags/$TAG" --jq .object.type)
                  [ "$type" = tag ] || { echo "::error::$TAG has no message; make it with git tag -a and write the release notes there"; exit 1; }

            - name: Choose the systems to build
              id: pick
              env:
                  EVENT: ${{ github.event_name }}
                  REF: ${{ github.ref }}
                  CHOICE: ${{ inputs.platforms }}
                  MESSAGE: ${{ github.event.head_commit.message }}
              run: |
                  want=linux
                  if [ "$EVENT" = workflow_dispatch ]; then want="$CHOICE"; fi
                  case "$REF" in refs/tags/v*) want=all ;; esac
                  case "$MESSAGE" in
                      *'[ci all]'*) want=all ;;
                      *'[ci windows]'*) want=windows ;;
                      *'[ci macos]'*) want=macos ;;
                  esac
                  matrix=$(jq -cn --arg want "$want" '
                      [{name: "linux", os: "ubuntu-latest", script: "dist:linux", target: "linux-x64", ffmpeg: "linux-x64/ffmpeg"},
                       {name: "windows", os: "windows-latest", script: "dist:win", target: "win-x64", ffmpeg: "win-x64/ffmpeg.exe"},
                       {name: "macos", os: "macos-latest", script: "dist:mac", target: "", ffmpeg: "mac-arm64/ffmpeg"}]
                      | map(select($want == "all" or .name == $want)) | {include: .}')
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
                  echo "building: $matrix"
                  # Linux and Windows programs are built in containers on Linux; macOS builds its own.
                  bundled=$(echo "$matrix" | jq -c '[.include[].target | select(. != "")] + ["linux-x64"] | unique
                      | [.[] as $target | ("ffmpeg", "librespot") | {tool: ., target: $target}]')
                  echo "bundled=$bundled" >> "$GITHUB_OUTPUT"

    # Our own FFmpeg (LGPL) and librespot builds (packaging/desktop/scripts/build-*.sh), rebuilt only
    # when their scripts change.
    bundled:
        needs: plan
        name: ${{ matrix.tool }} ${{ matrix.target }}
        runs-on: ubuntu-latest
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.plan.outputs.bundled) }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Restore the build
              id: cache
              uses: actions/cache@v6
              with:
                  path: bundled/${{ matrix.tool }}/${{ matrix.target }}
                  key: ${{ matrix.tool }}-${{ matrix.target }}-${{ hashFiles(format('packaging/desktop/scripts/build-{0}.sh', matrix.tool), 'packaging/desktop/scripts/build.js') }}
                  enableCrossOsArchive: true

            - name: Build it
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  WIIJUKEBOX_BUILDS: ${{ github.workspace }}/bundled
                  WIIJUKEBOX_CONTAINER: docker
              run: node packaging/desktop/scripts/build.js ${{ matrix.tool }} ${{ matrix.target }}

            - name: Check that FFmpeg has nothing GPL-only or nonfree
              if: matrix.tool == 'ffmpeg'
              run: bash packaging/desktop/scripts/check-ffmpeg.sh bundled/ffmpeg/${{ matrix.target }}

    build:
        needs: [plan, bundled]
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            WIIJUKEBOX_BUILDS: ${{ github.workspace }}/bundled

        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      packaging/desktop/package-lock.json

            - name: Cache Electron and the FFmpeg sources
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/wiijukebox-desktop
                      ~/.cache/electron
                      ~/.cache/electron-builder
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: desktop-${{ runner.os }}-${{ hashFiles('packaging/desktop/scripts/stage.js', 'packaging/desktop/package-lock.json') }}

            - name: Restore our FFmpeg build
              if: matrix.target != ''
              uses: actions/cache/restore@v6
              with:
                  path: bundled/ffmpeg/${{ matrix.target }}
                  key: ffmpeg-${{ matrix.target }}-${{ hashFiles('packaging/desktop/scripts/build-ffmpeg.sh', 'packaging/desktop/scripts/build.js') }}
                  enableCrossOsArchive: true
                  fail-on-cache-miss: true

            - name: Restore our librespot build
              if: matrix.target != ''
              uses: actions/cache/restore@v6
              with:
                  path: bundled/librespot/${{ matrix.target }}
                  key: librespot-${{ matrix.target }}-${{ hashFiles('packaging/desktop/scripts/build-librespot.sh', 'packaging/desktop/scripts/build.js') }}
                  enableCrossOsArchive: true
                  fail-on-cache-miss: true

            - name: Restore our macOS builds
              if: runner.os == 'macOS'
              id: mac-bundled
              uses: actions/cache@v6
              with:
                  path: |
                      bundled/ffmpeg/mac-arm64
                      bundled/ffmpeg/mac-x64
                      bundled/librespot/mac-arm64
                      bundled/librespot/mac-x64
                  key: mac-bundled-${{ hashFiles('packaging/desktop/scripts/build-ffmpeg.sh', 'packaging/desktop/scripts/build-librespot.sh', 'packaging/desktop/scripts/build.js') }}

            - name: Build FFmpeg and librespot for macOS
              if: runner.os == 'macOS' && steps.mac-bundled.outputs.cache-hit != 'true'
              run: |
                  brew install nasm
                  for target in mac-arm64 mac-x64; do
                      node packaging/desktop/scripts/build.js ffmpeg "$target"
                      bash packaging/desktop/scripts/check-ffmpeg.sh "bundled/ffmpeg/$target"
                      node packaging/desktop/scripts/build.js librespot "$target"
                  done

            - name: Install system packages
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends ffmpeg xvfb rpm pkg-config libfreetype-dev libgbm1 libnss3 libgtk-3-0t64 libasound2t64 libxss1 libxtst6

            - name: Install server dependencies
              run: npm ci

            - name: Server tests
              if: runner.os == 'Linux'
              run: |
                  npm test
                  npm run smoke

            - name: Desktop unit tests
              if: runner.os != 'Linux'
              run: node --test test/desktop-app.test.js test/desktop-shell.test.js

            - name: Install desktop dependencies
              working-directory: packaging/desktop
              run: npm ci

            - name: Build the app
              working-directory: packaging/desktop
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                      npm run ${{ matrix.script }} && exit 0
                      echo "build failed (attempt $attempt)"
                      sleep 15
                  done
                  exit 1

            # A URL that names a host makes FFmpeg resolve it; an old static Linux build crashed there.
            - name: Decode a stream by host name with the included FFmpeg
              env:
                  WIIJUKEBOX_FFMPEG: ${{ github.workspace }}/bundled/ffmpeg/${{ matrix.ffmpeg }}
              run: node --test test/decoder-hostname.test.js

            - name: List what was built
              shell: bash
              run: ls -lh packaging/dist/desktop

            # Linux: run the real AppImage under a virtual display.
            - name: Smoke test the AppImage
              if: runner.os == 'Linux'
              working-directory: packaging/desktop
              run: |
                  xvfb-run -a node scripts/smoke.js ../dist/desktop/WiiJukebox-*-linux-x64.AppImage --port "$SMOKE_PORT" --login --ytdlp --default-ports 2>&1 | tee ../dist/smoke-linux.log
                  exit "${PIPESTATUS[0]}"

            # Linux: the .deb installed for real, running with Chromium's sandbox and the installed menu entry.
            - name: Build the .deb
              if: runner.os == 'Linux'
              working-directory: packaging/desktop
              run: npm run dist:linux-deb

            - name: Smoke test the installed .deb
              if: runner.os == 'Linux'
              working-directory: packaging/desktop
              run: |
                  sudo apt-get install -y ../dist/desktop/wiijukebox_*_amd64.deb
                  ls -l /opt/WiiJukebox/chrome-sandbox /usr/share/applications/wiijukebox.desktop
                  SMOKE_SANDBOX=1 xvfb-run -a node scripts/smoke.js /opt/WiiJukebox/wiijukebox --port "$SMOKE_PORT" --login 2>&1 | tee ../dist/smoke-linux-deb.log
                  status="${PIPESTATUS[0]}"
                  sudo apt-get remove -y wiijukebox
                  test ! -e /opt/WiiJukebox/wiijukebox && echo "removed cleanly"
                  exit "$status"

            # Linux: the .rpm installed on a real Fedora, so its dependencies must resolve there.
            - name: Build the .rpm
              if: runner.os == 'Linux'
              working-directory: packaging/desktop
              run: npm run dist:linux-rpm

            - name: Smoke test the .rpm installed on Fedora
              if: runner.os == 'Linux'
              run: |
                  docker run --rm --shm-size=1g -v "$PWD:/work:ro" -w /work fedora:latest bash -euo pipefail -c '
                      dnf install -y -q ./packaging/dist/desktop/wiijukebox-*-1.x86_64.rpm glibc-common
                      missing=$(ldd /opt/WiiJukebox/wiijukebox | grep "not found" || true)
                      test -z "$missing" || { echo "libraries the rpm does not pull in:"; echo "$missing"; exit 1; }
                      echo "every shared library resolves from the rpm dependencies alone"
                      dnf install -y -q nodejs xorg-x11-server-Xvfb xorg-x11-xauth
                      rpm -qi wiijukebox
                      rpm -ql wiijukebox | grep -E "applications|hicolor|build-id|/opt/WiiJukebox/(wiijukebox|chrome-sandbox)$"
                      xvfb-run -a node packaging/desktop/scripts/smoke.js /opt/WiiJukebox/wiijukebox --port 4680 --login
                      dnf remove -y -q wiijukebox
                      test ! -e /opt/WiiJukebox/wiijukebox && echo "removed cleanly"
                  ' 2>&1 | tee packaging/dist/smoke-linux-rpm.log
                  exit "${PIPESTATUS[0]}"

            # Windows: the portable zip, then the installer installed and removed again.
            - name: Smoke test the portable zip
              if: runner.os == 'Windows'
              working-directory: packaging/desktop
              shell: pwsh
              run: |
                  $zip = Get-ChildItem ../dist/desktop/WiiJukebox-*-win-x64-portable.zip | Select-Object -First 1
                  Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\portable"
                  node scripts/smoke.js "$env:RUNNER_TEMP\portable\WiiJukebox.exe" --port $env:SMOKE_PORT --login --ytdlp --default-ports *>&1 | Tee-Object ../dist/smoke-windows-zip.log
                  $smoke = $LASTEXITCODE
                  $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
                  foreach ($name in (Get-Item $run).Property) {
                      $value = (Get-ItemProperty $run).$name
                      if ($value -like '*WiiJukebox*') { "login item: $name = $value"; Remove-ItemProperty $run -Name $name }
                  }
                  if ($smoke -ne 0) { exit 1 }

            - name: Check the executable's icon and version resources
              if: runner.os == 'Windows'
              shell: powershell
              run: |
                  $exe = "$env:RUNNER_TEMP\portable\WiiJukebox.exe"
                  $info = (Get-Item $exe).VersionInfo
                  "ProductName=$($info.ProductName) FileDescription=$($info.FileDescription) FileVersion=$($info.FileVersion)"
                  if ($info.ProductName -ne 'WiiJukebox') { throw 'the executable still has Electron''s resources' }
                  Add-Type -AssemblyName System.Drawing
                  [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save("$PWD\packaging\dist\exe-icon.png")

            - name: Install, smoke test and uninstall with the installer
              if: runner.os == 'Windows'
              working-directory: packaging/desktop
              shell: pwsh
              run: |
                  $setup = Get-ChildItem ../dist/desktop/WiiJukebox-*-win-x64-setup.exe | Select-Object -First 1
                  $dir = "$env:RUNNER_TEMP\WiiJukeboxInstalled"
                  Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait
                  $start = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\WiiJukebox.lnk"
                  $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'WiiJukebox.lnk'
                  "installed: $(Test-Path "$dir\WiiJukebox.exe"), start menu shortcut: $(Test-Path $start), desktop shortcut: $(Test-Path $desktop)"
                  if (-not (Test-Path "$dir\WiiJukebox.exe") -or -not (Test-Path $start)) { throw 'the installer did not install the app and its shortcut' }
                  node scripts/smoke.js "$dir\WiiJukebox.exe" --port $env:SMOKE_PORT --login *>&1 | Tee-Object ../dist/smoke-windows-installed.log
                  $smoke = $LASTEXITCODE
                  $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
                  foreach ($name in (Get-Item $run).Property) {
                      if ((Get-ItemProperty $run).$name -like '*WiiJukebox*') { Remove-ItemProperty $run -Name $name }
                  }
                  Start-Process -FilePath "$dir\Uninstall WiiJukebox.exe" -ArgumentList '/S', "_?=$dir" -Wait
                  "uninstalled: $(-not (Test-Path "$dir\WiiJukebox.exe")), start menu shortcut gone: $(-not (Test-Path $start))"
                  if ($smoke -ne 0) { exit 1 }

            - name: Windows Firewall helper
              if: runner.os == 'Windows'
              continue-on-error: true
              shell: pwsh
              run: |
                  node -e "require('./packaging/desktop/lib/firewall').allowWindowsFirewall(process.env.RUNNER_TEMP + '\\WiiJukeboxInstalled\\WiiJukebox.exe').then(() => console.log('rule added'), (e) => { console.error(e.message); process.exit(1); })"
                  if ($LASTEXITCODE -ne 0) { exit 1 }
                  Get-NetFirewallRule -DisplayName WiiJukebox | Format-List DisplayName, Direction, Action, Profile, Enabled

            # macOS: the zips (each architecture), the disk images, and the signature the build left on the apps.
            - name: Unpack the macOS builds
              if: runner.os == 'macOS'
              working-directory: packaging/dist/desktop
              run: |
                  for arch in arm64 x64; do
                      mkdir -p "$RUNNER_TEMP/mac-$arch"
                      ditto -x -k WiiJukebox-*-mac-$arch.zip "$RUNNER_TEMP/mac-$arch"
                      echo "== $arch"
                      codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/mac-$arch/WiiJukebox.app"
                      codesign -dv "$RUNNER_TEMP/mac-$arch/WiiJukebox.app" 2>&1 | grep -E 'Identifier|Signature|Format' || true
                      echo "Gatekeeper (an unsigned download is expected to be rejected):"
                      spctl --assess --type execute --verbose "$RUNNER_TEMP/mac-$arch/WiiJukebox.app" 2>&1 || true
                      file "$RUNNER_TEMP/mac-$arch/WiiJukebox.app/Contents/Resources/bin/ffmpeg"
                  done
                  for dmg in WiiJukebox-*-mac-*.dmg; do
                      hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
                      ls "$RUNNER_TEMP/dmg"
                      codesign --verify --deep --strict "$RUNNER_TEMP/dmg/WiiJukebox.app" && echo "$dmg: app inside verifies"
                      hdiutil detach "$RUNNER_TEMP/dmg"
                  done

            - name: Smoke test the Apple silicon app
              if: runner.os == 'macOS'
              working-directory: packaging/desktop
              run: |
                  node scripts/smoke.js "$RUNNER_TEMP/mac-arm64/WiiJukebox.app" --port "$SMOKE_PORT" --login --ytdlp --default-ports 2>&1 | tee ../dist/smoke-macos-arm64.log
                  exit "${PIPESTATUS[0]}"

            - name: Smoke test the Intel app under Rosetta
              if: runner.os == 'macOS'
              working-directory: packaging/desktop
              run: |
                  if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
                      sudo softwareupdate --install-rosetta --agree-to-license || true
                  fi
                  if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
                      echo "::warning::Rosetta is not available on this runner, so the Intel app was built but not run"
                      exit 0
                  fi
                  node scripts/smoke.js "$RUNNER_TEMP/mac-x64/WiiJukebox.app" --arch x86_64 --port "$SMOKE_PORT" 2>&1 | tee ../dist/smoke-macos-x64.log
                  exit "${PIPESTATUS[0]}"

            # The release job moves a tag's installers onto its draft release and deletes these.
            - name: Upload the installers
              if: success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
              uses: actions/upload-artifact@v7
              with:
                  name: WiiJukebox-${{ matrix.name }}
                  path: |
                      packaging/dist/desktop/*.AppImage
                      packaging/dist/desktop/*.deb
                      packaging/dist/desktop/*.rpm
                      packaging/dist/desktop/*.zip
                      packaging/dist/desktop/*.exe
                      packaging/dist/desktop/*.dmg
                  if-no-files-found: error
                  retention-days: 1

            - name: Upload the smoke test logs
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: smoke-logs-${{ matrix.name }}
                  path: |
                      packaging/dist/*.log
                      packaging/dist/*.png
                  if-no-files-found: ignore
                  retention-days: 3

    # devkitPPC r50 and libogc 3.1.0, the toolchain every hardware-tested Wii build used.
    wii:
        needs: plan
        runs-on: ubuntu-latest
        timeout-minutes: 20
        container: docker.io/devkitpro/devkitppc:20260503@sha256:44cb1a920e1ec3ec7c06767493c3b85f8d643d6137cc4661f0201895ac6e4967
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Install what the host tests need
              run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev libfreetype-dev pkg-config

            - name: Client host tests
              run: make -C client host-test

            - name: Build the Wii app and its zips
              run: make -C client -j"$(nproc)" package

            - name: Upload the Wii zips
              if: success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
              uses: actions/upload-artifact@v7
              with:
                  name: WiiJukebox-wii
                  path: client/dist/WiiJukebox-*-wii*.zip
                  if-no-files-found: error
                  retention-days: 1

    android:
        needs: plan
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Install Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            - name: Install the Android platform and build tools
              run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

            - name: Build the debug APK
              if: "!startsWith(github.ref, 'refs/tags/v')"
              run: sh packaging/android/build.sh

            # Android only installs an update signed with the same key, so a release must never ship unsigned.
            - name: Build the signed APK
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
                  PROPERTIES: ${{ secrets.ANDROID_SIGNING_PROPERTIES }}
              run: |
                  if [ -z "$KEYSTORE" ] || [ -z "$PROPERTIES" ]; then
                      echo "::error::add the ANDROID_SIGNING_KEYSTORE and ANDROID_SIGNING_PROPERTIES secrets (packaging/README.md, Releasing)"
                      exit 1
                  fi
                  echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
                  { echo "$PROPERTIES" | grep -v '^storeFile'; echo "storeFile=$RUNNER_TEMP/release.jks"; } > "$RUNNER_TEMP/keystore.properties"
                  WIIJUKEBOX_SIGNING="$RUNNER_TEMP/keystore.properties" sh packaging/android/build.sh release
                  rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.properties"
                  mv packaging/dist/WiiJukebox-android.apk "packaging/dist/WiiJukebox-$(jq -r .version package.json)-android.apk"

            - name: Check the APK's signature and version
              run: |
                  tools="$ANDROID_HOME/build-tools/36.0.0"
                  for apk in packaging/dist/WiiJukebox-*android*.apk; do
                      "$tools/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
                      "$tools/aapt2" dump badging "$apk" | head -1
                  done

            - name: Upload the APK
              if: success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
              uses: actions/upload-artifact@v7
              with:
                  name: WiiJukebox-android
                  path: packaging/dist/WiiJukebox-*android*.apk
                  if-no-files-found: error
                  retention-days: 1

    # Release assets don't count against Actions storage, unlike artifacts.
    release:
        needs: [build, wii, android]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            actions: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Put the apps and FFmpeg's sources on a draft release, with the tag's message as its notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
                  RUN: ${{ github.run_id }}
                  REPO: ${{ github.repository }}
              run: |
                  gh run download "$RUN" --repo "$REPO" --pattern 'WiiJukebox-*' --dir installers
                  # The LGPL and GPL ask for the exact sources next to the binaries.
                  bash packaging/desktop/scripts/build-ffmpeg.sh sources ffmpeg-source
                  cp packaging/desktop/scripts/build-ffmpeg.sh packaging/desktop/scripts/build.js ffmpeg-source/
                  tar -cf "installers/WiiJukebox-${TAG#v}-ffmpeg-source.tar" -C ffmpeg-source .
                  find installers -type f -exec ls -l {} +
                  tag=$(gh api "repos/$REPO/git/refs/tags/$TAG" --jq .object.sha)
                  gh api "repos/$REPO/git/tags/$tag" --jq .message > notes.md
                  if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
                      gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
                  else
                      gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "WiiJukebox ${TAG#v}" --notes-file notes.md
                  fi
                  find installers -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
                  gh api "repos/$REPO/actions/runs/$RUN/artifacts" --paginate \
                      --jq '.artifacts[] | select(.name | startswith("WiiJukebox-")) | .id' \
                      | while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id"; done
